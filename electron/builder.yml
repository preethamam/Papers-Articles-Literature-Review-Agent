appId: edu.usc.litreview
productName: Lit Review Agent
copyright: Copyright (c) 2026 USC
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  app: .
  output: dist-installers
  buildResources: build

# better-sqlite3 lives under extraResources/app — do not let electron-builder
# treat app/ as the Electron application package (it looks for index.js).
npmRebuild: false
nodeGypRebuild: false

icon: build/icon.png

files:
  - "!**/*"
  - dist-electron/**/*
  - package.json

asar: true

extraResources:
  - from: app
    to: app
    filter:
      - "**/*"
      - "!node_modules/.cache/**"
      - "!**/tsconfig.json"
  - from: .env.example
    to: app/.env.example

mac:
  category: public.app-category.productivity
  target:
    - dmg
  # Explicitly skip code signing for unsigned CI builds.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

dmg:
  title: Lit Review Agent ${version}
  # Use the app icon as the mounted volume icon so the logo shows on the disk image.
  icon: build/icon.png
  iconSize: 128
  iconTextSize: 13
  window:
    width: 600
    height: 420
  # App icon front-and-center on the left, drag-to-Applications on the right.
  contents:
    - x: 165
      y: 210
      type: file
    - x: 435
      y: 210
      type: link
      path: /Applications

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  runAfterFinish: false
  shortcutName: Lit Review Agent
  uninstallDisplayName: Lit Review Agent

publish: null
